    <title>YCDI Programme Hub</title>
    <meta name="description" content="Programmes, spiritual ministry, prayer, directory and safeguarding for the Young Christian Development Initiative." />

    <link rel="icon" type="image/png" href="/favicon-ycdi.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#09ADEA" />

    <!-- iOS ignores the manifest for home-screen installs and reads these. -->

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- The font files come from a second host. Opening those connections
         while the page is still parsing saves a round trip on a slow link. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
